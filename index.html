<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Daddy - Voice-Activated Co-Pilot for EV Charging</title>
  <meta name="description" content="Find reliable, compatible, fast EV chargers while you focus on the road. EV Daddy considers charge time, adapters, ratings, and nearby amenities.">
  <meta name="theme-color" content="#f5d0fe" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0d1a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: linear-gradient(135deg, #fce7f3 0%, #e9d5ff 50%, #ddd6fe 100%);
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --accent-purple: #8B5CF6;
      --accent-green: #22C55E;
      --card-bg: rgba(255, 255, 255, 0.8);
      --input-bg: #ffffff;
      --input-border: #d1d5db;
      --subtitle-user-bg: rgba(34, 197, 94, 0.9);
      --subtitle-ai-bg: rgba(139, 92, 246, 0.9);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: linear-gradient(135deg, #0f0d1a 0%, #1a1625 50%, #0f0d1a 100%);
        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;
        --card-bg: rgba(30, 27, 45, 0.8);
        --input-bg: #1f1b2e;
        --input-border: #374151;
        --subtitle-user-bg: rgba(34, 197, 94, 0.95);
        --subtitle-ai-bg: rgba(139, 92, 246, 0.95);
      }
    }

    html {
      height: 100%;
      background: #f5d0fe;
    }

    @media (prefers-color-scheme: dark) {
      html {
        background: #0f0d1a;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .icon {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.3);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .demo-section {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .phone-frame {
      position: relative;
      width: min(380px, 45vh);
      flex-shrink: 0;
      border-radius: clamp(36px, 6vh, 54px);
      padding: clamp(8px, 1.5vh, 12px);
      background: #1a1a1a;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    .phone-frame::before {
      width: clamp(80px, 13vh, 120px);
      height: clamp(24px, 4vh, 34px);
      top: clamp(12px, 2vh, 18px);
      border-radius: clamp(12px, 2vh, 17px);
    }

    .phone-screen {
      border-radius: clamp(28px, 5vh, 42px);
    }

    @media (max-width: 800px) {
      .demo-section {
        justify-content: flex-start;
        gap: 0;
        margin-left: -50px;
      }

      .phone-frame {
        width: 220px;
        border-radius: 32px;
        padding: 6px;
      }

      .phone-frame::before {
        width: 70px;
        height: 20px;
        top: 10px;
        border-radius: 10px;
      }

      .phone-screen {
        border-radius: 26px;
      }

      .chat-container {
        width: 140px;
        margin-left: -25px;
        margin-right: -35px;
        gap: 2px;
        max-height: calc(220px * 19.5 / 9);
        overflow-y: auto;
      }

      .chat-bubble {
        padding: 3px 5px;
        font-size: 12px !important;
        border-radius: 6px;
        line-height: 1.15;
        max-width: 95%;
      }

      .chat-bubble::after {
        width: 5px;
        height: 5px;
      }

      .chat-bubble.user::after {
        right: -2px;
      }

      .chat-bubble.ai::after {
        left: -2px;
      }
    }

    .phone-frame::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: #0a0a0a;
      z-index: 10;
    }

    .phone-screen {
      position: relative;
      overflow: hidden;
      background: #000;
      aspect-ratio: 9 / 19.5;
    }

    .phone-screen video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-container {
      width: 340px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0.5rem;
    }

    .chat-bubble {
      position: relative;
      display: inline-block;
      padding: 0.75rem 1.1rem;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 500;
      max-width: 85%;
      color: white;
      text-align: left;
      line-height: 1.45;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-row {
      display: flex;
    }

    .chat-row.user {
      justify-content: flex-end;
    }

    .chat-row.ai {
      justify-content: flex-start;
    }

    .chat-bubble.user {
      background: var(--subtitle-user-bg);
      border-bottom-right-radius: 4px;
    }

    .chat-bubble.user::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: -6px;
      width: 12px;
      height: 12px;
      background: var(--subtitle-user-bg);
      clip-path: polygon(0 0, 0 100%, 100% 100%);
    }

    .chat-bubble.ai {
      background: var(--subtitle-ai-bg);
      border-bottom-left-radius: 4px;
    }

    .chat-bubble.ai::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: -6px;
      width: 12px;
      height: 12px;
      background: var(--subtitle-ai-bg);
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .carplay-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .carplay-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .carplay-logo {
      width: 80px;
      height: auto;
    }

    .carplay-description {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 300px;
    }

    @media (max-width: 800px) {
      .carplay-section {
        flex-direction: column;
        gap: 1rem;
      }

      .carplay-label {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
        justify-items: start;
        gap: 0.25rem 0.75rem;
        font-size: 1rem;
        text-align: left;
      }

      .carplay-logo {
        width: 50px;
        grid-row: 1 / 3;
        grid-column: 1;
        align-self: center;
      }

      .carplay-label span {
        grid-row: 1;
        grid-column: 2;
        align-self: end;
      }

      .carplay-description {
        grid-row: 2;
        grid-column: 2;
        text-align: left;
        max-width: none;
        font-size: 0.8rem;
      }
    }

    .dashboard-frame {
      position: relative;
      width: min(500px, 90vw);
      margin: 0 auto;
      padding: 12px;
      background: linear-gradient(145deg, #2a2a2a 0%, #1a1a1a 50%, #0a0a0a 100%);
      border-radius: 24px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.3);
    }

    .dashboard-frame::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: #333;
      border-radius: 2px;
    }

    .dashboard-screen {
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    .dashboard-screen img {
      width: 100%;
      display: block;
    }

    .invite-section {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 1.5rem;
    }

    .invite-section h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .invite-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .invite-input {
      padding: 0.875rem 1rem;
      font-size: 1rem;
      border: 2px solid var(--input-border);
      border-radius: 12px;
      background: var(--input-bg);
      color: var(--text-primary);
      text-align: center;
      transition: border-color 0.2s ease;
    }

    .invite-input:focus {
      outline: none;
      border-color: var(--accent-purple);
    }

    .invite-input::placeholder {
      color: var(--text-secondary);
    }

    .invite-button {
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .invite-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
    }

    .invite-button:active {
      transform: translateY(0);
    }

    .invite-error {
      color: #ef4444;
      font-size: 0.875rem;
      margin-top: 0.5rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .invite-error.visible {
      opacity: 1;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .invite-input.shake {
      animation: shake 0.4s ease;
      border-color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="assets/icon.png" alt="EV Daddy Icon" class="icon">
      <h1>EV Daddy</h1>
    </div>

    <p class="tagline">Sometimes everyone needs little help finding a good EV charger.</p>

    <div class="demo-section">
      <div class="phone-frame">
        <div class="phone-screen">
          <video id="demo-video" autoplay muted playsinline>
            <source src="assets/demo.mp4" type="video/mp4">
          </video>
        </div>
      </div>

      <div id="chat-container" class="chat-container"></div>
    </div>


    <div class="carplay-section">
      <div class="carplay-label">
        <img src="assets/carplay_logo.svg" alt="CarPlay" class="carplay-logo">
        <span>Works with CarPlay</span>
        <p class="carplay-description">EV Daddy crunches ratings, adapters, restaraunts and more while you focus on the road ahead.</p>
      </div>
      <div class="dashboard-frame">
        <div class="dashboard-screen">
          <img src="assets/carplay.png" alt="EV Daddy on CarPlay">
        </div>
      </div>
    </div>

    <div class="invite-section">
      <h2>Join the Beta</h2>
      <form class="invite-form" id="invite-form">
        <input
          type="text"
          class="invite-input"
          id="invite-code"
          placeholder="Enter invite code"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit" class="invite-button">Get Beta Access</button>
        <p class="invite-error" id="invite-error">Invalid invite code</p>
      </form>
    </div>
  </div>

  <!-- Encrypted TestFlight URL (injected by GitHub Action) -->
  <script id="encrypted-data" type="application/json">{"encrypted":"PLACEHOLDER_ENCRYPTED_DATA","iv":"PLACEHOLDER_IV","salt":"PLACEHOLDER_SALT"}</script>

  <script>
    // ============================================
    // SRT Parser
    // ============================================
    function parseSRT(srtText) {
      const subtitles = [];
      const blocks = srtText.trim().split(/\n\n+/);

      for (const block of blocks) {
        const lines = block.split('\n');
        if (lines.length < 3) continue;

        // Parse timestamp line (format: 00:00:00,000 --> 00:00:00,000)
        const timeMatch = lines[1].match(
          /(\d{2}):(\d{2}):(\d{2}),(\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2}),(\d{3})/
        );
        if (!timeMatch) continue;

        const start =
          parseInt(timeMatch[1]) * 3600 +
          parseInt(timeMatch[2]) * 60 +
          parseInt(timeMatch[3]) +
          parseInt(timeMatch[4]) / 1000;

        const end =
          parseInt(timeMatch[5]) * 3600 +
          parseInt(timeMatch[6]) * 60 +
          parseInt(timeMatch[7]) +
          parseInt(timeMatch[8]) / 1000;

        // Parse text (may be multiple lines)
        const text = lines.slice(2).join(' ');

        // Parse speaker tag [User]: or [AI]:
        const speakerMatch = text.match(/^\[(\w+)\]:\s*(.*)$/);
        let speaker = 'ai';
        let content = text;

        if (speakerMatch) {
          speaker = speakerMatch[1].toLowerCase();
          content = speakerMatch[2];
        }

        subtitles.push({ start, end, speaker, content });
      }

      return subtitles;
    }

    // ============================================
    // Chat Display
    // ============================================
    let subtitles = [];
    let shownSubtitles = new Set();
    const video = document.getElementById('demo-video');
    const chatContainer = document.getElementById('chat-container');

    async function loadSubtitles() {
      try {
        const response = await fetch('assets/subtitles.srt');
        if (!response.ok) return;
        const srtText = await response.text();
        subtitles = parseSRT(srtText);
      } catch (e) {
        console.log('No subtitles file found');
      }
    }

    function updateChat() {
      const time = video.currentTime;

      // Find all subtitles that should be shown by now
      subtitles.forEach((sub, index) => {
        if (time >= sub.start && !shownSubtitles.has(index)) {
          shownSubtitles.add(index);
          addChatBubble(sub);
        }
      });
    }

    function addChatBubble(sub) {
      const row = document.createElement('div');
      row.className = `chat-row ${sub.speaker}`;

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${sub.speaker}`;
      bubble.textContent = sub.content;

      row.appendChild(bubble);
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function resetChat() {
      shownSubtitles.clear();
      chatContainer.innerHTML = '';
    }

    video.addEventListener('timeupdate', updateChat);
    loadSubtitles();

    // ============================================
    // AES Decryption (Web Crypto API)
    // ============================================
    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        enc.encode(password),
        'PBKDF2',
        false,
        ['deriveKey']
      );

      return crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: 100000,
          hash: 'SHA-256'
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function decrypt(encryptedData, iv, salt, password) {
      try {
        const key = await deriveKey(password, salt);
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          encryptedData
        );
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return null;
      }
    }

    function base64ToArrayBuffer(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    // ============================================
    // Form Handler
    // ============================================
    const form = document.getElementById('invite-form');
    const input = document.getElementById('invite-code');
    const error = document.getElementById('invite-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const code = input.value.trim();
      if (!code) {
        showError();
        return;
      }

      try {
        const dataEl = document.getElementById('encrypted-data');
        const data = JSON.parse(dataEl.textContent);

        if (data.encrypted === 'PLACEHOLDER_ENCRYPTED_DATA') {
          // Development mode - no encryption set up yet
          console.log('Encryption not configured. Set up GitHub secrets.');
          showError();
          return;
        }

        const encrypted = base64ToArrayBuffer(data.encrypted);
        const iv = base64ToArrayBuffer(data.iv);
        const salt = base64ToArrayBuffer(data.salt);

        const url = await decrypt(encrypted, iv, salt, code);

        if (url && url.startsWith('https://')) {
          window.location.href = url;
        } else {
          showError();
        }
      } catch (e) {
        showError();
      }
    });

    function showError() {
      input.classList.add('shake');
      error.classList.add('visible');

      setTimeout(() => {
        input.classList.remove('shake');
      }, 400);

      setTimeout(() => {
        error.classList.remove('visible');
      }, 3000);
    }
  </script>
</body>
</html>
